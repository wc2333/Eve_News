# Eve_News · AI 每日资讯 配置文件
# 复制成 config.yaml 后按需修改：evenews init 会自动完成这一步
# 密码/API Key 建议放环境变量或同目录 .env 文件，不要写进本文件

log_level: INFO
out_dir: out
state_dir: state

brand:
  company: 公司名
  logo_text: AI
  kicker: DAILY AI BRIEFING
  title: AI 每日资讯
  classification: 内部参考
  footer_note: 自动生成 · 仅供内部参考，转载请注明出处
  background: "#f5f3ee"
  accent: "#b5322d"
  label: "#2f5c9b"
  text: "#1f2328"

# 每日发送时间（本机时区见 timezone）；evenews daemon 或系统计划任务都读这里
schedule:
  time: "08:00"
  timezone: Asia/Shanghai
  weekday_only: false

# 邮件（SMTP）：QQ/163/企业邮箱/Google Workspace 均可
email:
  enabled: true
  smtp_host: smtp.example.com
  smtp_port: 465
  security: ssl            # ssl | starttls | none
  username: bot@example.com
  password_env: EVE_NEWS_SMTP_PASSWORD   # 读取该环境变量作为密码
  from: "AI 每日资讯 <bot@example.com>"
  to:
    - team@example.com
  cc: []
  subject_template: "{title} · {date}"
  subject_prefix: ""
  attach_html: false
  timeout: 30
  retries: 2

# 信息搜集与写作所用的模型：改 provider/base_url/model 即可换供应商
# provider: mock(离线演示) | openai | anthropic | ollama | deepseek | moonshot | dashscope | siliconflow
llm:
  provider: mock
  base_url: https://api.openai.com/v1
  model: gpt-5.4-mini
  api_key_env: EVE_NEWS_LLM_API_KEY
  temperature: 0.2
  timeout: 180
  retries: 2
  json_mode: true
  max_output_tokens: 8000
  batch_size: 8           # 一次给模型多少条候选；摘要变长了就调小一点
  tasks:                    # 哪些环节交给模型做；关掉则退化为规则处理
    select: true            # 筛选、排序、去重
    classify: true          # 判断条目属于哪个板块
    summarize: true         # 生成 200-260 字综合介绍（发生了什么 + 关键数字 + 影响）
    lead: true              # 写今日摘要导语
  # 可选：让模型自己联网检索补充信息（留空则只用下面的固定来源）
  search:
    provider: none          # none | tavily | serper
    api_key_env: EVE_NEWS_SEARCH_API_KEY
    queries_per_section: 2

collection:
  mode: feeds               # feeds(只用来源池) | llm(优先模型检索) | hybrid(两者都跑)
  lookback_hours: 30        # 只看最近这么多小时内的条目
  per_source_limit: 30      # 每个来源最多取多少条
  dedupe_days: 10           # 多少天内不重复推送同一篇
  timeout: 25
  retries: 1              # 单个来源失败后重试几次
  proxy: ""                 # 留空=跟随系统代理；none=强制不走代理；也可填 http://127.0.0.1:7890
  headers:
    Accept-Language: zh-CN,zh;q=0.9,en;q=0.6
  require_keywords: [AI, ai, 人工智能, 大模型, 大语言模型, LLM, GPT, Agent, 智能体, 算力, 芯片, 机器人, AIGC, 机器学习, 深度学习, 神经网络, 训练, 推理, 多模态, GPU, HBM, 英伟达, OpenAI, Anthropic, DeepSeek, Qwen, Claude, Gemini, Llama]
  exclude_keywords: [招聘, 征文, 抽奖, 广告, 促销, 课程优惠, 直播预约, 新玩意, 好物, 开箱, 购物清单]

# 来源池：板块里按名字引用即可，避免重复配置
# 单个来源想单独放宽/收紧时间窗，就在来源里加 lookback_hours（小时），不写则跟 collection.lookback_hours
# 某个来源老超时（境外源常见），加 enabled: false 先停用，不用删掉整段
sources:
  ithome:
    url: https://www.ithome.com/rss/
  qbitai:
    url: https://www.qbitai.com/feed
  jiqizhixin:
    url: https://www.jiqizhixin.com/rss
    enabled: false           # 实测返回网页 HTML，官方 RSS 已停更；想用就改成 enabled: true
  leiphone:
    url: https://www.leiphone.com/feed
  ifanr:
    url: https://www.ifanr.com/feed
  36kr:
    url: https://36kr.com/feed
    enabled: false           # 实测返回网页 HTML，公开 RSS 已失效；想用就改成 enabled: true
  huxiu:
    url: https://www.huxiu.com/rss/0.xml
    enabled: false           # 实测两次都读超时，先停用；想用就改成 enabled: true
  sspai:
    url: https://sspai.com/feed
    enabled: false           # 个人向分享为主，按需求不抓
  infoq:
    url: https://www.infoq.cn/feed
  semi:
    url: http://www.semi.org.cn/feed
    enabled: false           # 实测 404，先停用；能访问时改成 enabled: true
  huggingface:
    url: https://huggingface.co/blog/feed.xml
    enabled: false           # 境内直连不稳，改用魔搭 modelscope；能走代理时改 enabled: true
  openai:
    url: https://openai.com/news/rss.xml
  modelscope:
    url: https://modelscope.cn/api/v1/articles?PageSize=30
    type: json                    # JSON 接口也能当来源：用下面的 json 映射成条目
    json:
      items: Data.Articles        # 数组在返回 JSON 里的位置
      title: Title
      summary: [Desc, TitleDesc]  # 依次取第一个非空的摘要字段
      url: [ContentUrl, Url]
      date: GmtPublished          # 支持秒级时间戳或日期字符串
      base_url: https://modelscope.cn
      require: [IsPGC]            # 只留平台/机构发布的内容，个人帖不抓
  hf_trending:
    url: https://hf-mirror.com/api/models?sort=trendingScore&direction=-1&limit=30
    type: json                    # HuggingFace 官方 API 境内不通，走 hf-mirror 镜像，直连即可
    lookback_hours: 336           # 本来源单独放宽到 14 天：模型上榜往往比发布晚几天
    json:
      title: modelId              # 例：Qwen/Qwen-Image-2.1
      url: [modelId]
      base_url: https://hf-mirror.com
      date: createdAt
      summary: [tags]             # 接口没有正文，就把 tags 当材料给模型
      facts: [pipeline_tag, library_name, likes, downloads, trendingScore]
      require: [likes>=30, trendingScore>=1]   # 只要新且有热度的模型，个人练手仓库自动过滤
  google_ai:
    url: https://blog.google/technology/ai/rss/
  arxiv_cl:
    url: https://rss.arxiv.org/rss/cs.CL
  arxiv_lg:
    url: https://rss.arxiv.org/rss/cs.LG
  oschina:
    url: https://www.oschina.net/news/rss     # 开源中国：国产开源与工具动态
  solidot:
    url: https://www.solidot.org/index.rss    # Solidot：科技短讯，更新很勤
  geekpark:
    url: https://www.geekpark.net/rss         # 极客公园：硬件与产品
  tmtpost:
    url: https://www.tmtpost.com/feed         # 钛媒体：产业与融资，当天出稿
  juejin:
    url: https://juejin.cn/rss                # 掘金社区：以个人博客为主，按需求不抓
    enabled: false

# 6 个板块，enabled: false 即不采集也不推送；也可用 evenews enable/disable 切换
sections:
  - id: llm_oss
    title: 大模型与开源生态
    description: 模型发布、评测榜单、开源权重、API 价格与开发者生态
    enabled: true
    max_items: 6
    sources: [qbitai, modelscope, hf_trending, openai, arxiv_cl, infoq, oschina]
    extra_prompt: 优先模型发布、能力评测、开源权重与价格变化；给出关键数字（参数量、价格、榜单名次）。
    keywords: [大模型, 开源, 权重, 发布, 模型, LLM, GPT, Qwen, 通义, DeepSeek, Kimi, GLM, 文心, 豆包, 混元, Claude, Gemini, Llama, Mistral, HuggingFace, 微调, 蒸馏, 多模态, MoE, 上下文, 推理模型]


  - id: model_releases
    title: 新模型与开源权重速览
    description: 近期上榜的新模型与开源权重（按热度排序，个人练手仓库不抓）
    enabled: true
    max_items: 4
    sources: [hf_trending, modelscope]
    extra_prompt: 每条讲清楚模型是什么、谁发布的、参数或能力规模、许可证与能不能本地部署；材料里没有的指标不要评价、不要编。
    keywords: [模型, 权重, 开源, 发布, LLM, Qwen, DeepSeek, Llama, GGUF, 多模态, 推理, 微调, MoE, safetensors, diffusers]

  - id: edge_ai
    title: 端侧 AI 与芯片峰会
    description: 手机/PC 端侧模型、峰会发布、算法备案与合规
    enabled: true
    max_items: 5
    sources: [ithome, ifanr, qbitai, leiphone, google_ai, solidot]
    extra_prompt: 关注端侧/终端 AI 能力、峰会发布、国内备案与合规进展。
    keywords: [端侧, 终端, 手机, 高通, 骁龙, 联发科, 天玑, 苹果, iOS, 鸿蒙, 小米, OPPO, vivo, 备案, NPU, 边缘, 小模型, 量化, 离线, 端云]

  - id: domestic_compute
    title: 国产算力与集群
    description: 国产 GPU/NPU、智算中心、超节点集群与供应链
    enabled: true
    max_items: 5
    sources: [semi, 36kr, qbitai, modelscope, ithome, arxiv_lg, infoq, tmtpost]
    extra_prompt: 关注国产芯片性能数据、智算中心建设、集群规模与供应链变化。
    keywords: [国产算力, 华为, 昇腾, 寒武纪, 海光, 壁仞, 摩尔线程, 燧原, 沐曦, 天数智芯, 超节点, 智算中心, 算力, 集群, 液冷, 光模块, HBM, CoWoS, 先进制程, 服务器]

  - id: devices_robotics
    title: 端侧设备与具身智能
    description: 机器人、自动驾驶、AI 硬件与具身智能进展
    enabled: true
    max_items: 5
    sources: [ithome, ifanr, leiphone, 36kr, geekpark, tmtpost]
    extra_prompt: 关注人形机器人/机器狗、自动驾驶、AI 硬件的量产与落地数据。
    keywords: [具身智能, 机器人, 人形机器人, 机器狗, 机械臂, 自动驾驶, 智驾, 座舱, 无人机, 智能硬件, AI PC, 眼镜, 耳机, 传感器, 灵巧手, 大模型机器人]

  - id: wearables
    title: 智能眼镜与可穿戴
    description: AI 眼镜、头显、手表耳机等可穿戴新形态
    enabled: true
    max_items: 4
    sources: [ifanr, ithome, sspai, huxiu, geekpark]
    extra_prompt: 关注 AI 眼镜/头显/手表的销量、供应链与新交互形态。
    keywords: [智能眼镜, AI 眼镜, 眼镜, AR, MR, VR, 头显, 手表, 手环, 耳机, 戒指, 吊坠, 可穿戴, Ray-Ban, Meta, 摄像头, 麦克风]

  - id: industry_capital
    title: 行业商业 · 资本与算力
    description: 融资并购、财报产能、政策监管与算力经济学
    enabled: true
    max_items: 5
    sources: [36kr, huxiu, qbitai, infoq, tmtpost, solidot]
    extra_prompt: 关注融资估值、商业化收入、Token/算力成本与政策监管。
    keywords: [融资, 估值, IPO, 上市, 投资, 并购, 财报, 营收, 毛利, 涨价, 降价, 产能, 出货量, 政策, 监管, 备案, Token 工厂, 商业化, 市场规模]
