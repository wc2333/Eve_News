name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q --tb=short
      - name: Offline smoke (generates a digest without keys or network)
        run: |
          python -m evenews init --dir demo
          python -m evenews -c demo/config.yaml preview --offline --out demo/out
      - name: Upload demo digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            demo/out/*.html
            demo/out/*/*.html
